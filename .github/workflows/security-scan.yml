name: Security Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    - cron: "23 14 * * 3"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast:
    name: SpotBugs + FindSecBugs (java SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # CodeQL 不可用（私有仓库未开通 GHAS），用 SpotBugs+FindSecBugs 作为免费 SAST 替代。
      # failOnError=false：报告不阻塞合入，结果看 artifact 与日志。
      - name: SpotBugs SAST
        run: mvn -B -Psecurity-sast -DskipTests verify

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency Check
    # NVD 同步慢，仅周期/手动/main 推送时运行，PR 上只跑 SAST
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # NVD API 限流导致偶发失败，non-blocking，报告上传 artifact 供查看
      - name: OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check -Dformat=HTML
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
