name: Trivy Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * 5"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (deps / misconfig / image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 测试由 CI workflow 负责，此处只打包供依赖扫描与镜像构建
      - name: Maven package (skip tests)
        run: mvn -B package -DskipTests -Dmaven.test.skip=true

      # 1) 应用依赖漏洞（扫描 fat jar 内的依赖库）
      - name: Trivy — dependency vulnerabilities (fat jar)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/hdgatewayservice-0.0.1.jar
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

      # 2) Dockerfile / k8s 清单配置错误
      - name: Trivy — misconfig (Dockerfile + k8s)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

      - name: Build service image
        run: docker build -f Dockerfile -t hdgatewayservice:ci .

      # 3) 镜像漏洞（OS 包 + 语言依赖）
      - name: Trivy — image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hdgatewayservice:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table
