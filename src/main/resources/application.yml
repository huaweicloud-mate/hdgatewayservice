server:
  port: ${PORT:3003}
spring:
  application:
    name: hdgatewayservice
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hdgatewayservice}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}

gateway:
  # 路由白名单：蓝区调用方只能通过 route 名访问已配置的绿区上游，天然防 SSRF。
  # url 支持环境变量覆盖；固定路由的 url 即完整接口地址（invoke 时 path 省略）；
  # auth 取值：HIS（4 头 apigw + IAM token）/ APPCODE（华为云 APIG 简单认证）/ NONE（直连）
  # 以下 5 条对应 hdkitservice 已在调用的绿区接口，url 由部署环境注入实际值
  routes:
    # ── 激励服务（hdincentiveservice）──
    - name: hdincentiveservice-coupon-check
      url: "${GW_ROUTE_HDINCENTIVESERVICE_COUPON_CHECK_URL:https://apigw-dgg-b0.huawei.com/api/v1/hdincentiveservice/coupon/check-coupon-issued}"
      auth: HIS
      methods: POST
    - name: hdincentiveservice-coupon-issue
      url: "${GW_ROUTE_HDINCENTIVESERVICE_COUPON_ISSUE_URL:https://apigw-dgg-b0.huawei.com/api/v2/hdincentiveservice/coupon/issue-coupon}"
      auth: HIS
      methods: POST
    # ── 竞赛服务 ──
    - name: competition-signup-query
      url: "${GW_ROUTE_COMPETITION_SIGNUP_QUERY_URL:}"
      auth: HIS
      methods: POST
    # ── 协议服务（hdasdevservice）──
    - name: hdasdevservice-agreement-query
      url: "${GW_ROUTE_HDASDEVSERVICE_AGREEMENT_QUERY_URL:https://developer.myhuaweicloud.com/v1/agreementservice/developer/agreement/query}"
      auth: APIG
      methods: GET,POST
    - name: hdasdevservice-agreement-sign
      url: "${GW_ROUTE_HDASDEVSERVICE_AGREEMENT_SIGN_URL:https://developer.myhuaweicloud.com/v1/agreementservice/developer/agreement/sign}"
      auth: APIG
      methods: POST
    # ── 账号服务（hdaccountservice）──
    - name: hdaccountservice-realname-developer-info
      url: "${GW_ROUTE_HDACCOUNTSERVICE_REALNAME_DEVELOPER_INFO_URL:https://developer.myhuaweicloud.com/v1/hdaccountservice/realname/get-developer-info}"
      auth: APIG
      methods: GET,POST
  # 注：codearts-package / officeace-subscription 不纳入网关——二者是"验证调用方本人"接口，
  # 需用调用方自己的 AK/SK 做 SDK-HMAC-SHA256 签名（URL 还是 base+动态路径），与网关凭证模型冲突，保留在 hdkitservice

hdgateway:
  his:
    app-code: "${GW_HIS_APPCODE:}"
    hw-id: "${GW_HIS_HW_ID:}"
    app-key: "${GW_HIS_APPKEY:}"
    # test 环境直接使用静态 token；production 走 IAM 动态获取并缓存
    auth-token: "${GW_HIS_AUTH_TOKEN:}"
    iam-endpoint: "${GW_HIS_IAM_ENDPOINT:https://iam.cn-north-4.myhuaweicloud.com/v3/auth/tokens}"
    iam-username: "${GW_HIS_IAM_USERNAME:}"
    iam-password: "${GW_HIS_IAM_PASSWORD:}"
    iam-domain-name: "${GW_HIS_IAM_DOMAIN_NAME:}"
  # 全局兜底 APPCODE（路由未单独配置 app-code 时使用）
  app-code: "${GW_APPCODE:}"
  deploy-env: "${DEPLOY_ENV:production}"
  log-mask-keys: "${LOG_MASK_KEYS:password,passwd,pwd,secret,token,sk,access_key,private_key,authorization,cookie,credential,appcode,app_code,api_key,apikey,id_card_number,realname,contact_phone,contact_email}"
  connect-timeout-ms: "${GW_CONNECT_TIMEOUT_MS:10000}"
  read-timeout-ms: "${GW_READ_TIMEOUT_MS:30000}"
  # 调用方透传头黑名单前缀（不区分大小写）：凭证/主机/逐跳头一律丢弃
  caller-header-deny: "${GW_CALLER_HEADER_DENY:host,content-length,authorization,cookie,connection,transfer-encoding,expect,x-apig,x-hw,x-auth,x-api-key,x-traceid}"
