apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdgatewayservice
  namespace: huaweicloud-agent
  labels:
    app: hdgatewayservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hdgatewayservice
  template:
    metadata:
      labels:
        app: hdgatewayservice
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: server
          # TODO: 鏇挎崲涓烘祴璇?SWR 闀滃儚鍦板潃:tag
          image: swr.cn-south-1.myhuaweicloud.com/<test-org>/hdgatewayservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
              protocol: TCP
          volumeMounts:
            - name: log-volume
              mountPath: /opt/cloud/logs/hdgatewayservice
          env:
            - name: PORT
              value: "3003"
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: MYSQL_DATABASE
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: DEPLOY_ENV
              value: "test"
            - name: GW_HIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: GW_HIS_AUTH_TOKEN
                  optional: true
            - name: GW_ROUTE_HDINCENTIVESERVICE_COUPON_CHECK_URL
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: GW_ROUTE_HDINCENTIVESERVICE_COUPON_CHECK_URL
                  optional: true
            - name: GW_ROUTE_HDINCENTIVESERVICE_COUPON_ISSUE_URL
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: GW_ROUTE_HDINCENTIVESERVICE_COUPON_ISSUE_URL
                  optional: true
            - name: GW_ROUTE_COMPETITION_SIGNUP_QUERY_URL
              valueFrom:
                secretKeyRef:
                  name: hdgw-secrets
                  key: GW_ROUTE_COMPETITION_SIGNUP_QUERY_URL
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: log-volume
          persistentVolumeClaim:
            claimName: hdgatewayservice-logs
